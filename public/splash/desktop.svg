<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RevelaCode desktop splash screen</title>
  <desc id="desc">A navy technology background with a blue and green circuit-inspired r mark, gold orbital line and the Code. Innovate. Transform. tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020817"/><stop offset=".52" stop-color="#071831"/><stop offset="1" stop-color="#020817"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A74DA"/><stop offset=".52" stop-color="#11C6C7"/><stop offset="1" stop-color="#2E8B57"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D4AF37"/><stop offset=".55" stop-color="#FFF0A5"/><stop offset="1" stop-color="#D4AF37"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#0A74DA" stop-opacity=".35"/><stop offset="1" stop-color="#0A74DA" stop-opacity="0"/></radialGradient>
    <pattern id="hex" width="120" height="104" patternUnits="userSpaceOnUse"><path d="M30 2 90 2 118 52 90 102 30 102 2 52Z" fill="none" stroke="#1673B8" stroke-opacity=".22" stroke-width="1.5"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#hex)"/>
  <ellipse cx="800" cy="390" rx="520" ry="330" fill="url(#halo)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".82">
    <g stroke="#0A74DA" stroke-width="3">
      <path d="M0 215H190L235 260H375M0 270H135L182 317H310M0 330H90L130 370H245"/>
      <path d="M1600 205H1400L1350 255H1210M1600 275H1465L1410 330H1290M1600 345H1515L1475 390H1370"/>
    </g>
    <g stroke="#2E8B57" stroke-width="3">
      <path d="M0 430H125L165 470H285M1600 455H1480L1440 495H1320"/>
    </g>
    <g stroke="#D4AF37" stroke-width="2.5">
      <path d="M0 375H75L110 410H205M1600 400H1520L1480 440H1390"/>
    </g>
  </g>
  <g filter="url(#glow)">
    <g fill="#0EA5E9"><circle cx="235" cy="260" r="6"/><circle cx="182" cy="317" r="5"/><circle cx="1350" cy="255" r="6"/><circle cx="1410" cy="330" r="5"/></g>
    <g fill="#22C55E"><circle cx="165" cy="470" r="6"/><circle cx="1440" cy="495" r="6"/></g>
    <g fill="#EAB308"><circle cx="110" cy="410" r="5"/><circle cx="1480" cy="440" r="5"/></g>
  </g>
  <g transform="translate(800 360)">
    <text x="0" y="105" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="330" font-weight="800" fill="url(#mark)" stroke="#7DD3FC" stroke-opacity=".52" stroke-width="3" filter="url(#glow)">r</text>
    <g fill="none" stroke="#DDF8FF" stroke-width="5" stroke-linecap="round" opacity=".95">
      <path d="M-42 30V-70L-4 -108V-145M0 35V-24L38 -64V-112M42 30V-4L78 -40"/>
    </g>
    <g fill="#D4AF37" stroke="#FFF3B0" stroke-width="2" filter="url(#glow)">
      <circle cx="-4" cy="-145" r="9"/><circle cx="38" cy="-112" r="8"/><circle cx="78" cy="-40" r="8"/>
    </g>
    <ellipse cx="0" cy="10" rx="258" ry="90" transform="rotate(-17)" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
  </g>
  <text x="800" y="590" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="104" font-weight="800" letter-spacing="-3">
    <tspan fill="#F8FAFC">Revela</tspan><tspan fill="#D4AF37">Code</tspan>
  </text>
  <text x="800" y="652" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="500" letter-spacing="3" fill="#E2E8F0">Code. Innovate. Transform.</text>
  <g filter="url(#glow)"><path d="M530 700H730M870 700H1070" stroke="url(#gold)" stroke-width="3"/><circle cx="780" cy="700" r="8" fill="#0EA5E9"/><circle cx="820" cy="700" r="8" fill="#22C55E"/></g>
  <path d="M0 795Q400 675 800 760T1600 790V900H0Z" fill="#06162E" opacity=".7"/>
  <path d="M0 800Q400 680 800 765T1600 795" fill="none" stroke="#0A74DA" stroke-width="5" opacity=".9" filter="url(#glow)"/>
  <path d="M0 812Q400 692 800 777T1600 807" fill="none" stroke="#2E8B57" stroke-width="1.5" opacity=".65"/>
</svg>