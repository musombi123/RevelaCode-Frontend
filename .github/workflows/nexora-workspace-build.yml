name: RevelaCode and NEXORA independent frontend build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/nexora/**"
      - "src/main.jsx"
      - "src/App.jsx"
      - "public/revelacode-sw.js"
      - "public/revelacode-sw.js"
      - "README.md"
      - "docs/NEXORA_PATH_BASED_HOSTING.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nexora-workspace-build.yml"
  push:
    branches:
      - main
    paths:
      - "src/main.jsx"
      - "src/App.jsx"
      - "README.md"
      - "docs/NEXORA_PATH_BASED_HOSTING.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nexora-workspace-build.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build NEXORA and RevelaCode frontends
        run: npm run build:web
