name: NEXORA workspace build

on:
  pull_request:
    paths:
      - "src/components/nexora/**"
      - "src/components/dashboardConfig.jsx"
      - "src/components/MainDashboardV2.jsx"
      - "src/App.jsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nexora-workspace-build.yml"
  push:
    branches:
      - feat/nexora-foundry-workspace-integration
    paths:
      - "src/components/nexora/**"
      - "src/components/dashboardConfig.jsx"
      - "src/components/MainDashboardV2.jsx"
      - "src/App.jsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nexora-workspace-build.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build RevelaCode frontend
        run: npm run build
