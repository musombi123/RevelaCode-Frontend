name: RevelaCode build — legacy NEXORA redirect

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/utils/nexoraRedirect.mjs"
      - "tests/nexora-redirect.test.mjs"
      - "src/App.jsx"
      - "src/main.jsx"
      - "public/_redirects"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nexora-workspace-build.yml"
  push:
    branches:
      - main
      - feat/nexora-foundry-workspace-integration
    paths:
      - "src/utils/nexoraRedirect.mjs"
      - "tests/nexora-redirect.test.mjs"
      - "src/App.jsx"
      - "src/main.jsx"
      - "public/_redirects"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nexora-workspace-build.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build RevelaCode frontend
        run: npm run build
      - name: Verify legacy NEXORA redirect boundary
        run: node --test tests/nexora-redirect.test.mjs
