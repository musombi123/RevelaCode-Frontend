name: Dispatch Android build when web source changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-android.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "Frontend branch, tag, or commit SHA to package"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      ANDROID_DISPATCH_TOKEN: ${{ secrets.REVELACODE_ANDROID_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch the exact frontend revision to RevelaCode-Android
        id: android_dispatch
        if: ${{ env.ANDROID_DISPATCH_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.ANDROID_DISPATCH_TOKEN }}
          script: |
            const frontendRef = context.eventName === "workflow_dispatch"
              ? (context.payload.inputs?.frontend_ref || "main")
              : context.sha;
            const commitMessage = context.payload.head_commit?.message || "";
            const publishRelease = context.eventName === "push"
              && commitMessage.includes("[publish-android-release]");
            const clientPayload = {
              frontend_ref: frontendRef,
              build_type: publishRelease ? "release" : "debug",
              ...(publishRelease ? {
                version_name: "2.2.0",
                version_code: "4"
              } : {}),
              triggered_by: context.eventName
            };
            try {
              await github.rest.repos.createDispatchEvent({
                owner: "musombi123",
                repo: "RevelaCode-Android",
                event_type: "frontend-updated",
                client_payload: clientPayload
              });
              core.setOutput("dispatched", "true");
              core.info(`Dispatched Android ${clientPayload.build_type} packaging for frontend ref ${frontendRef}`);
            } catch (error) {
              core.setOutput("dispatched", "false");
              core.warning(`Android build dispatch was rejected: ${error.message}. Give REVELACODE_ANDROID_DISPATCH_TOKEN Contents: write access to musombi123/RevelaCode-Android, or run the Android workflow manually.`);
            }

      - name: Explain manual fallback
        if: ${{ always() && (env.ANDROID_DISPATCH_TOKEN == '' || steps.android_dispatch.outputs.dispatched != 'true') }}
        run: |
          echo "::warning::Android packaging was not started automatically."
          echo "For automatic dispatch, set REVELACODE_ANDROID_DISPATCH_TOKEN to a token with Contents: write access on musombi123/RevelaCode-Android."
          echo "Manual fallback: run the Android build and launch verification workflow and set frontend_ref to the frontend commit SHA shown in this run."
