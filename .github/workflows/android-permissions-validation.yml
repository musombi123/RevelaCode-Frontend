name: Android permission bridge validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-permissions-validation.yml"
      - ".github/workflows/android-release.yml"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/configure-android-permissions.mjs"
      - "src/App.jsx"
      - "src/components/AndroidPermissionSetup.jsx"
      - "src/native/androidPermissions.js"

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-android-permissions.mjs

      - name: Compile native Android permission bridge
        run: cd android && ./gradlew --no-daemon assembleDebug
