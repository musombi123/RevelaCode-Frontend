name: MissionPulse frontend validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/faith/MissionPulse.jsx"
      - "src/components/FaithDashboard.jsx"
      - "src/App.jsx"
      - ".github/workflows/missionpulse-validation.yml"

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
