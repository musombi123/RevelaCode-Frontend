name: RevelaCode authenticated profile build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/revelaai-v2-memory-perception-integration
      - feat/usect-foundry-fastapi-native

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:auth
      - run: npm run build
