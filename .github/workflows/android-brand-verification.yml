name: Android branding verification build

# This is a debug/device-testing build only. Signed release packaging remains manual.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-brand-verification.yml"
      - "public/Logo.png"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/configure-android-permissions.mjs"
      - "scripts/set-android-release-version.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Generate all Android icons and splash from public/Logo.png
        run: |
          test -s public/Logo.png
          mkdir -p .android-brand-assets
          cp public/Logo.png .android-brand-assets/logo.png
          npx capacitor-assets generate --android --assetPath .android-brand-assets --iconBackgroundColor '#08111F' --iconBackgroundColorDark '#08111F' --splashBackgroundColor '#08111F' --splashBackgroundColorDark '#08111F'

      - name: Sync and configure Android permissions
        run: |
          npx cap sync android
          node scripts/configure-android-permissions.mjs

      - name: Set Android package version
        env:
          ANDROID_VERSION_NAME: "2.1.0"
          ANDROID_VERSION_CODE: "3"
        run: node scripts/set-android-release-version.mjs

      - name: Build installable debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: revelacode-android-logo-splash-v2.1.0-code3
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
