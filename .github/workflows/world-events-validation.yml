name: World Events frontend validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/Dashboard/Community/WorldEventsDesk.jsx"
      - "src/Dashboard/CommunityDashboard.jsx"
      - "src/components/ProphecyEventsDashboard.jsx"
      - "src/components/FaithDashboard.jsx"
      - ".github/workflows/world-events-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/Dashboard/Community/WorldEventsDesk.jsx"
      - "src/Dashboard/CommunityDashboard.jsx"
      - "src/components/ProphecyEventsDashboard.jsx"
      - "src/components/FaithDashboard.jsx"
      - ".github/workflows/world-events-validation.yml"

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
