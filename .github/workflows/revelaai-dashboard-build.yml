name: RevelaAI dashboard build and regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/revelaai-dashboard-free-mode-voice-vision]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run authentication regressions
        run: npm run test:auth
      - name: Run Community comments regressions
        run: npm run test:community
      - name: Run RevelaAI dashboard contracts
        run: node --test tests/revelaai-dashboard-contract.test.mjs
      - name: Run hub plans visibility contracts
        run: node --test tests/hub-plans-visibility.test.mjs
      - name: Run admin operations contracts
        run: node --test tests/admin-operations-contract.test.mjs
      - name: Build production frontend
        run: npm run build
